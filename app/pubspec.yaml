name: fitsense_app
description: "FitSense AI - On-Device Push-up Form Assessment Mobile Application"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # Pose Estimation: Google MediaPipe Pose Landmarker (pinned as per ADR-001)
  flutter_mp_pose_landmarker: 0.1.9

  # Permissions & Device Control
  permission_handler: ^11.3.1
  wakelock_plus: ^1.2.8

  # Voice Audio Coaching
  flutter_tts: ^4.2.2

  # Local Persistence (Offline SQLite)
  sqflite: ^2.3.3
  path_provider: ^2.1.2
  path: ^1.9.0

  # Data Visualization
  fl_chart: ^0.70.2

  # Networking & Sync
  http: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  test: ^1.25.0

flutter:
  uses-material-design: true
  assets:
    - .env.example
